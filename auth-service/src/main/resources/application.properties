# ?? Server ????????????????????????????????????????????
server.port=8081
spring.application.name=auth-service

# ?? MySQL Database ????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/spendsmart_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ???????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# You can hardcode it here for testing:
google.client-id=${GOOGLE_CLIENT_ID}

# ?? JWT ???????????????????????????????????????????????
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiry=86400000

# ?? Swagger UI ????????????????????????????????????????

# ============================================================
#  CORS ? Allow gateway and Swagger UI to fetch API docs
# ============================================================
spring.web.cors.allowed-origins=http://localhost:8080,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# SpringDoc ? expose API docs for gateway aggregation
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

services.analytics-service.url=http://localhost:8086