# Server
server.port=8080
spring.application.name=api-gateway

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Deduplicate CORS headers ? prevents double headers from gateway + microservice
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.spendsmart.gateway=DEBUG

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# path where Swagger UI is served
springdoc.swagger-ui.path=/swagger-ui.html

# Each microservice URL ? gateway routes these to the real service
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth-service
springdoc.swagger-ui.urls[1].name=Category Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/category-service
springdoc.swagger-ui.urls[2].name=Expense Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/expense-service
springdoc.swagger-ui.urls[3].name=Income Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/income-service
springdoc.swagger-ui.urls[4].name=Budget Service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/budget-service
springdoc.swagger-ui.urls[5].name=Analytics Service
springdoc.swagger-ui.urls[5].url=/v3/api-docs/analytics-service

springdoc.swagger-ui.urls-primary-name=Auth Service